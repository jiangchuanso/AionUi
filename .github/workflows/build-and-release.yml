name: Build and Release

permissions:
  contents: write
  packages: write
  issues: read
  pull-requests: read
  actions: write

on:
  push:
    branches: [dev]
    tags:
      - '*'

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  # 独立 code-quality job,供桌面构建和 web-cli 打包共用,避免重复跑
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Run ESLint
        run: bun run lint

      - name: Check Prettier formatting
        run: bun run format:check

      - name: TypeScript type check
        run: bunx tsc --noEmit

      - name: Run unit tests
        run: bunx vitest run

  build-pipeline:
    name: Build Pipeline
    uses: ./.github/workflows/_build-reusable.yml
    needs: code-quality
    # dev 分支或正式 tag 触发构建（排除 -dev- tag，避免重复构建）
    # Fork 说明：已移除 PUBLISH_RELEASE 开关，构建始终执行，不再依赖仓库变量。
    if: needs.code-quality.result == 'success' && (github.ref == 'refs/heads/dev' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-')))
    with:
      skip_code_quality: true
      matrix: >-
        {"include":[
          {"platform":"macos-arm64","os":"macos-14","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"},
          {"platform":"macos-x64","os":"macos-14","command":"node scripts/build-with-builder.js x64 --mac --x64","artifact-name":"macos-build-x64","arch":"x64"},
          {"platform":"windows-x64","os":"windows-2022","command":"node scripts/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"},
          {"platform":"windows-arm64","os":"windows-11-arm","command":"node scripts/build-with-builder.js arm64 --win --arm64","artifact-name":"windows-build-arm64","arch":"arm64"},
          {"platform":"linux-x64","os":"ubuntu-latest","command":"node scripts/build-with-builder.js x64 --linux --x64","artifact-name":"linux-build-x64","arch":"x64"},
          {"platform":"linux-arm64","os":"ubuntu-24.04-arm","command":"node scripts/build-with-builder.js arm64 --linux --arm64","artifact-name":"linux-build-arm64","arch":"arm64"}
        ]}
    secrets: inherit

  pack-web-cli:
    name: Pack Web CLI
    uses: ./.github/workflows/pack-web-cli.yml
    needs: code-quality
    # 与桌面构建同频触发：dev 分支或正式 tag（排除 -dev- tag）
    # Fork 说明：已移除 PUBLISH_RELEASE 开关，打包始终执行。
    if: needs.code-quality.result == 'success' && (github.ref == 'refs/heads/dev' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-')))
    with:
      ref: ''
      append_commit_hash: false
      skip_code_quality: true
    secrets: inherit

  # Docker 镜像产物（x64 / arm64）。
  # 复用 pack-web-cli 产出的 linux tarball 作为构建上下文：镜像 = tarball 内容
  # （aionui-web 二进制 + aioncore 后端 + SPA 静态资源）+ 预装 officecli +
  # libicu，开箱即用，无需在客户服务器上再安装任何组件。
  # 镜像 tar 同时作为 Release 产物附加；GHCR 推送为尽力而为（登录失败不阻塞）。
  docker-images:
    name: Build Docker Image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: pack-web-cli
    # dev 分支或正式 tag 触发构建（排除 -dev- tag，避免重复构建）
    if: needs.code-quality.result == 'success' && (github.ref == 'refs/heads/dev' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-'))) && needs.pack-web-cli.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: ubuntu-latest, platform: 'linux/amd64', suffix: 'amd64' }
          - { arch: arm64, os: ubuntu-24.04-arm, platform: 'linux/arm64', suffix: 'arm64' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download web-cli tarball (linux-${{ matrix.arch }})
        uses: actions/download-artifact@v7
        with:
          name: web-cli-linux-${{ matrix.arch }}
          path: dist-web-cli

      - name: Stage Docker build context
        run: |
          mkdir -p dist-docker/context
          # 归一化文件名，Dockerfile 通过 WEB_CLI_TARBALL 接收
          cp dist-web-cli/aionui-web-*.tar.gz dist-docker/context/aionui-web.tar.gz
          ls -lh dist-docker/context/

      - name: Log in to GHCR
        id: ghcr_login
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 镜像 tar 产物是 Release 附件，构建不依赖 registry：始终本地 load
      - name: Build image (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: dist-docker/context
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          build-args: |
            WEB_CLI_TARBALL=aionui-web.tar.gz
          tags: |
            ghcr.io/${{ github.repository_owner }}/aionui:${{ steps.version.outputs.version }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.title=AionUi
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # 冒烟测试：officecli 能在镜像内直接执行（ICU 检查），且服务端能完整拉起
      - name: Smoke test image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/aionui:${{ steps.version.outputs.version }}-${{ matrix.suffix }}"
          # officecli 预装验证：.NET 二进制无 ICU 会直接 abort
          docker run --rm --entrypoint /usr/local/bin/officecli "$IMAGE" --version
          # 完整启动验证：SPA + 后端 + /api 代理
          docker run -d --name aionui-smoke -p 3000:3000 "$IMAGE"
          ready=""
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/api/system/info > /tmp/sysinfo.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          docker logs aionui-smoke | tail -30 || true
          docker rm -f aionui-smoke > /dev/null || true
          if [ -z "$ready" ]; then
            echo "::error::Container did not become ready within 90s"
            exit 1
          fi
          echo "✓ /api/system/info:"
          cat /tmp/sysinfo.json

      # GHCR 推送为尽力而为：失败只告警，不影响镜像 tar 产物
      - name: Push image to GHCR
        if: steps.ghcr_login.outcome == 'success'
        continue-on-error: true
        run: |
          docker push "ghcr.io/${{ github.repository_owner }}/aionui:${{ steps.version.outputs.version }}-${{ matrix.suffix }}"

      - name: Save image tarball
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/aionui:${{ steps.version.outputs.version }}-${{ matrix.suffix }}"
          OUT="dist-docker/aionui-docker-${{ steps.version.outputs.version }}-linux-${{ matrix.suffix }}.tar"
          docker save "$IMAGE" -o "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          ls -lh dist-docker/*.tar dist-docker/*.tar.sha256

      - name: Upload image tarball artifact
        uses: actions/upload-artifact@v6
        with:
          name: docker-image-linux-${{ matrix.suffix }}
          path: |
            dist-docker/*.tar
            dist-docker/*.tar.sha256
          retention-days: 7

  # 把两个架构的镜像合并成一个 multi-arch manifest 推到 GHCR
  # （docker pull ghcr.io/<owner>/aionui:<version> 自动选架构）。
  # 纯尽力而为：GHCR 推送失败不影响 Release 镜像 tar 产物。
  docker-manifest:
    name: Publish Multi-arch Docker Manifest
    runs-on: ubuntu-latest
    needs: docker-images
    if: needs.code-quality.result == 'success' && (github.ref == 'refs/heads/dev' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-'))) && needs.docker-images.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        id: ghcr_login
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Create multi-arch manifest
        if: steps.ghcr_login.outcome == 'success'
        continue-on-error: true
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/aionui"
          VERSION="${{ steps.version.outputs.version }}"
          docker buildx imagetools create -t "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          # 仅正式 tag 发布时移动 latest
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF" != *-dev-* ]]; then
            docker buildx imagetools create -t "$IMAGE:latest" \
              "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          fi

  # 自动重试 workflow 见 .github/workflows/auto-retry.yml
  # 原因：GitHub 只允许对「已结束」的 run 调用 rerun API，在本 run 内部调用
  # 必然返回 403 "This workflow is already running"，因此改为由 workflow_run 触发。

  # 自动创建tag（仅 dev 分支推送时）
  create-tag:
    name: Create Tag from Branch
    runs-on: ubuntu-latest
    needs: [build-pipeline]
    if: success() && github.ref == 'refs/heads/dev'
    outputs:
      tag_name: ${{ steps.create_tag.outputs.tag_name }}
      is_dev: ${{ steps.create_tag.outputs.is_dev }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # GH_TOKEN is a PAT with `repo` + `workflow` scopes — required because
          # tag pushes whose reachable history contains .github/workflows/
          # changes are rejected for the built-in GITHUB_TOKEN (lacks the
          # `workflow` scope, which GITHUB_TOKEN can never grant).
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create and push tag
        id: create_tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}

          # 根据分支确定 tag 格式
          if [ "$BRANCH_NAME" = "dev" ]; then
            TAG_NAME="v${VERSION}-dev-${COMMIT_SHORT}"
            IS_DEV="true"
            echo "🔧 Development release: $TAG_NAME"
          else
            TAG_NAME="v$VERSION"
            IS_DEV="false"
            echo "🚀 Production release: $TAG_NAME"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_dev=$IS_DEV" >> $GITHUB_OUTPUT

          # 检查远程tag是否已存在
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME$"; then
            if [ "$IS_DEV" = "false" ]; then
              # Main 分支：需要递增版本并修改 package.json
              echo "⚠️ Tag $TAG_NAME already exists, auto-incrementing version..."

              if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                MAJOR=${BASH_REMATCH[1]}
                MINOR=${BASH_REMATCH[2]}
                PATCH=${BASH_REMATCH[3]}
                NEW_PATCH=$((PATCH + 1))
                NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

                echo "📝 Updating package.json version to $NEW_VERSION"

                # 更新 package.json 版本号
                bun pm version $NEW_VERSION

                # 配置git用户信息
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"

                # 提交版本更新
                git add package.json bun.lock
                git commit -m "chore: bump version to $NEW_VERSION"
                git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
                git push origin $BRANCH_NAME

                # 获取新的 commit ID
                COMMIT_SHORT=$(git rev-parse --short HEAD)
                TAG_NAME="v${NEW_VERSION}-${COMMIT_SHORT}"

                echo "🚀 New tag with updated version: $TAG_NAME"
                echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
              else
                TAG_NAME="v${VERSION}-${COMMIT_SHORT}"
                echo "⚠️ Fallback: creating tag with commit ID: $TAG_NAME"
                echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
              fi
            else
              # Dev 分支 tag 已存在则失败（不应该发生）
              echo "⚠️ Dev tag $TAG_NAME already exists, this shouldn't happen"
              exit 1
            fi
          fi

          # 配置git用户信息（如果前面没配置）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 创建并推送tag
          echo "Creating tag: $TAG_NAME"
          git tag $TAG_NAME
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin $TAG_NAME
          echo "✅ Successfully created and pushed tag: $TAG_NAME"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  # 发布到 GitHub Releases
  # Fork 说明：已移除 PUBLISH_RELEASE 开关。正式 tag 推送一律走完整构建，并把安装包附加到
  # Release；构建或打包失败时不再产出「空 Release」，避免误以为发版成功。
  # 产物包含：桌面安装包、web-cli tarball、install-web.sh、Docker 镜像 tar（x64/arm64）。
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [code-quality, build-pipeline, create-tag, pack-web-cli, docker-images]
    # Tag 推送时 create-tag 会被跳过，所以需要检查两种情况（排除 -dev- tag 避免重复）
    # docker-manifest 是尽力而为的 GHCR 推送，不作为 Release 的前置条件
    if: always() && needs.code-quality.result == 'success' && (needs.create-tag.result == 'success' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-dev-'))) && needs.build-pipeline.result == 'success' && needs.pack-web-cli.result == 'success' && needs.docker-images.result == 'success'
    # dev 分支使用 dev-release 环境，正式 tag 使用 release 环境
    environment: ${{ needs.create-tag.outputs.is_dev == 'true' && 'dev-release' || 'release' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get version for release
        id: version
        run: |
          # 判断触发来源：正式 tag 推送 or dev 分支
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # 正式 Tag 推送触发（-dev- tag 已被排除，不会到达这里）
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            IS_DEV="false"
            echo "🚀 Creating stable release from tag: $TAG_NAME"
          else
            # dev 分支触发，使用 create-tag job 的输出
            TAG_NAME="${{ needs.create-tag.outputs.tag_name }}"
            IS_DEV="${{ needs.create-tag.outputs.is_dev }}"
            echo "🔧 Creating development release: $TAG_NAME"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is_dev=$IS_DEV" >> $GITHUB_OUTPUT

      # 安装包产物来自 build-pipeline / pack-web-cli / docker-images 各 job。
      # 改为逐 artifact 下载 + 独立重试（见脚本内注释）：原 download-artifact@v7
      # 不带 name 一次性并发拉全部 16 个产物，任一失败即整体中止且不报具体是哪个，
      # 还会拉两个用不上的 .dockerbuild 元数据产物。
      - name: Download release artifacts (resilient per-artifact)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/download-release-artifacts.sh "${GITHUB_RUN_ID}" build-artifacts

      - name: Prepare release assets (normalize updater metadata)
        shell: bash
        run: bash scripts/prepare-release-assets.sh build-artifacts release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.is_dev == 'true' && format('Development Build {0}', steps.version.outputs.tag_name) || steps.version.outputs.tag_name }}
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
            release-assets/**/*.dmg
            release-assets/**/*.deb
            release-assets/**/*.zip
            release-assets/**/*.yml
            release-assets/**/*.tar.gz
            release-assets/**/*.tar
            release-assets/**/*.sha256
            release-assets/install-web.sh
          generate_release_notes: true
          draft: true
          prerelease: ${{ steps.version.outputs.is_dev == 'true' || contains(steps.version.outputs.tag_name, 'beta') || contains(steps.version.outputs.tag_name, 'alpha') || contains(steps.version.outputs.tag_name, 'rc') }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
