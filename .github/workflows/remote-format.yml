name: Remote Format (Linux)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to reformat and push (default: main)'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format with Linux oxfmt
        run: bun run format

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style: reformat with Linux oxfmt"
          git push origin HEAD:${{ github.event.inputs.ref || 'main' }}
